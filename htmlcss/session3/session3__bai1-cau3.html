<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>session3-bai3</title>
        <link rel="stylesheet" href="./session3__bai1-cau3.css" />
    </head>
    <body>
        <h1>Liên hệ</h1>
        <p>
            F8 luôn lắng nghe và tiếp nhận mọi ý kiến đóng góp của bạn. Hãy liên
            hệ với chúng mình bằng cách điền thông tin vào form dưới đây. Chúng
            mình sẽ phản hồi bạn trong thời gian sớm nhất.
        </p>
        <div class="row">
            <div class="column1">
                <div class="column1__div-infof8">
                    <p>Số 1, ngõ 41, Trần Duy Hưng, Cầu Giấy, Hà Nội</p>
                    <a href="tel:08 1919 8989" class="div__a-number"
                        >08 1919 8989</a
                    >
                    <br />
                    <a href="mailto:contact@f8.edu.vn" class="div__a-email"
                        >contact@f8.edu.vn</a
                    >
                </div>
                <form class="form">
                    <label>
                        <label for="hoten">Họ và tên</label>
                        <input
                            type="text"
                            class="form__input"
                            placeholder="Nhập đầy đủ họ và tên.."
                        />
                    </label>
                    <label>
                        Email
                        <input
                            type="email"
                            placeholder="Nhập email..."
                            class="form__input"
                        />
                    </label>
                    <label>
                        Điện thoại
                        <input
                            type="number"
                            placeholder="Nhập số điện thoại..."
                            class="form__input"
                        />
                    </label>
                    <label>
                        Nội dung
                        <textarea
                            placeholder="Nhập nội dung liên hệ..."
                            class="form__input form__input--large"
                        ></textarea>
                    </label>
                    <button class="form__button">Gửi đi</button>
                </form>
            </div>
            <div class="column2">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1862.249748088812!2d105.80019056797025!3d21.012690847217712!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab4df3c6c329%3A0xd8e14fe61fd32604!2zQ8OUTkcgVFkgQ-G7lCBQSOG6pk4gQ8OUTkcgTkdI4buGIEdJw4FPIEThu6RDIEY4!5e0!3m2!1sen!2s!4v1785830041288!5m2!1sen!2s"
                    width="100%"
                    height="490px"
                    style="border-radius: 1rem; border: 1px solid #ccc"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"
                ></iframe>
            </div>
        </div>
    </body>
</html>
